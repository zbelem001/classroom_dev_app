name: docuresume_flutter
description: Application mobile DocuResume Pro avec Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # File Picker
  file_picker: ^8.1.4
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # PDF Viewer
  flutter_pdfview: ^1.3.2
  
  # Loading & Toast
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  
  # Utils
  intl: ^0.18.1
  path_provider: ^2.1.2
  mime: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets disabled for now - uncomment when you add images
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
  # Using system fonts for now - uncomment when you add custom fonts
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
